# Configuración para Firebase App Hosting
runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 10
  concurrency: 80

env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyDHqlUsx9yRysvTGYR3TMlhdBwKefLmNF0"
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "almacen-mgd.firebaseapp.com"
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "almacen-mgd"
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "almacen-mgd.firebasestorage.app"
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "89554017780"
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:89554017780:web:aa9b2dc5da9813882beda1"
  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: "G-JPMF5RG800"
  - variable: AFIP_CUIT
    value: "27313918144"

  - variable: AFIP_POS_PRODUCTOS
    value: "10"


  # Secretos (Configurar en Cloud Secret Manager)
