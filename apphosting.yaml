    secret: FIREBASE_SERVICE_ACCOUNT_KEY
  - variable: AFIP_SDK_ACCESS_TOKEN
    secret: AFIP_SDK_ACCESS_TOKEN 
  - variable: AFIP_CERT
    secret: AFIP_CERT
  - variable: AFIP_KEY
    secret: AFIP_KEY